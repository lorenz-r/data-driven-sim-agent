[project]
name = "data-driven-sim-agent"
version = "0.0.1"
description = "Data-driven simulation agent — workspace root"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av2",
    "hydra-core>=1.3.3",
    "kigras",
    "kigras_am",
    "kigras_ha",
    "matplotlib>=3.7,<4",
    "mypy>=2.1.0",
    "numpy>=1.26.4",
    "optuna>=4.9.0",
    "pillow>=10",
    "ruff>=0.15.13",
    "shapely>=2.0",
    "tqdm>=4.66,<5",
]

[tool.uv]
managed = true
index-strategy = "unsafe-best-match"
find-links = ["https://data.pyg.org/whl/torch-2.6.0+cu124.html"]
dependency-metadata = [
    { name = "torch-cluster", requires-dist = ["scipy"] },
    { name = "torch-scatter", requires-dist = [] },
]
no-build-isolation-package = ["torch-cluster", "torch-scatter"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.workspace]
members = [
    "packages/argoverse-forecasting",
    "packages/sim-integration",
    "packages/smart",
    "packages/smart-preprocess",
    "packages/trajectory-data",
    "tests",
    "packages/kigras",
    "packages/kigras_am",
    "packages/kigras_ha",
]

[tool.uv.sources]
sim-integration = { workspace = true }
argoverse-forecasting = { workspace = true }
integration-tests = { workspace = true }
smart = { workspace = true }
smart-preprocess = { workspace = true }
trajectory-data = { workspace = true }
kigras = { workspace = true}
kigras_am = { workspace = true}
kigras_ha = { workspace = true}

[tool.pytest.ini_options]
testpaths = ["tests/src", "packages/trajectory-data/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
pythonpath = ["."]
markers = [
    "gpu: marks tests requiring a GPU",
    "slow: marks slow tests",
]

[tool.mypy]
exclude = [
    "^packages/argoverse-forecasting/",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "maturin>=1.0",
    "ruff>=0.15.13",
]
