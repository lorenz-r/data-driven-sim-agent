[project]#-#
name = "integration-tests"#-#
version = "0.0.1"#-#
description = "Bootstrap integration & test package"#-#
requires-python = ">=3.11,<3.12"#-#
dependencies = [#-#
    "sim-integration[gpu]",#-#
    "pytest>=8.0,<9",#-#
    "pytest-xdist>=3.5,<4",#-#
]#-#
#-#
[build-system]#-#
requires = ["hatchling"]#-#
build-backend = "hatchling.build"#-#
#-#
[tool.hatch.build.targets.wheel]#-#
packages = ["src/integration_tests"]#-#
