name: CI

on:
  push:
    branches: [main]

  workflow_dispatch:
    
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "py3.11"

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.py

      - name: Install Dependencies
        run: uv sync --all-packages
      

      - name: Run Ruff (Linting & Formatting)
        if: steps.changed-files.outputs.all_changed_files != ''
        run: |
            FILES="${{ steps.changed-files.outputs.all_changed_files }}"
            uv run ruff check $FILES
            uv run ruff format --check $FILES

      - name: Run Mypy (Static Type Checking)
        if: steps.changed-files.outputs.all_changed_files != ''
        run: |
            FILES="${{ steps.changed-files.outputs.all_changed_files }}"
            SAFE_FILES=$(echo "$FILES" | tr ' ' '\n' | grep -v "argoverse-forecasting" | tr '\n' ' ')
            uv run mypy $SAFE_FILES

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "py3.11"

      - name: Test (CPU-only, skip GPU markers)
        run: bash ./test.sh

  test-gpu:
    runs-on: ubuntu-latest  # swap to self-hosted GPU runner when available
    if: false               # disabled until GPU runner exists
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-packages

      - name: Test (all)
        run: uv run pytest --tb=short -q
