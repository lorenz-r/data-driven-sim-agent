name: Overfit SMART on a single downloaded scenario

on:
  workflow_dispatch:
    inputs:
      storage:
        description: 'Relative path to store extracted data'
        required: false
        default: 'packages/smart/data/raw'
      preprocess_input:
        description: 'Input directory for preprocessing'
        required: false
        default: 'data/raw/train'
      preprocess_output:
        description: 'Output directory for preprocessing'
        required: false
        default: 'data/processed/train'

jobs:
  extract-and-preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run partial_extract action
        uses: ./.github/actions/partial_extract
        with:
          scenarios: '1'
          storage: ${{ github.event.inputs.storage }}

      - name: Install `uv` helper
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install system dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0

      - name: Make preprocess script executable
        run: |
          chmod +x packages/smart/scripts/run_preprocess.sh

      - name: Run preprocess script (uses script-managed venv)
        working-directory: packages/smart
        run: |
          echo "Running packages/smart/scripts/run_preprocess.sh"
          bash scripts/run_preprocess.sh \
            "${{ github.event.inputs.preprocess_input }}" \
            "${{ github.event.inputs.preprocess_output }}"

      - name: Train SMART
        working-directory: packages/smart
        run: |
            uv sync
            uv run train.py --cpu
