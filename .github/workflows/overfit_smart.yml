name: Overfit SMART on a single downloaded scenario

on:
  pull_request:
    paths:
      - 'packages/smart/**'
      - '.github/workflows/overfit_smart.yml'

env:
  STORAGE: ${{ github.event.inputs.storage || 'packages/smart/data/raw' }}
  PREPROCESS_INPUT: ${{ github.event.inputs.preprocess_input || 'data/raw/train' }}
  PREPROCESS_OUTPUT: ${{ github.event.inputs.preprocess_output || 'data/processed/train' }}
  MIN_ACCURACY: 0.3

jobs:
  extract-and-preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run partial_extract action
        uses: ./.github/actions/partial_extract
        with:
          scenarios: '1'
          storage: ${{ env.STORAGE }}

      - name: Install `uv` helper
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install system dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0

      - name: Make preprocess script executable
        run: |
          chmod +x packages/smart/scripts/run_preprocess.sh

      - name: Run preprocess script (uses script-managed venv)
        working-directory: packages/smart
        run: |
          echo "Running packages/smart/scripts/run_preprocess.sh"
          bash scripts/run_preprocess.sh \
            "${{ env.PREPROCESS_INPUT }}" \
            "${{ env.PREPROCESS_OUTPUT }}"

      - name: Train SMART
        working-directory: packages/smart
        run: |
            uv sync
            uv run train.py --cpu --return_accuracy accuracy.json

      - name: Check recorded accuracy and fail if below threshold
        working-directory: packages/smart
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          if [ ! -f accuracy.json ]; then
            echo "Accuracy file not found: accuracy.json"
            exit 1
          fi
          accuracy=$(jq -r '.accuracy' accuracy.json)
          if [ "$accuracy" -lt ${{ env.MIN_ACCURACY }} ]; then
            echo "Accuracy check failed (accuracy=$accuracy)"
            cat accuracy.json
            exit 1
          else
            echo "Accuracy check passed"
            cat accuracy.json
          fi
