name: Overfit SMART on a single downloaded scenario

on:
  pull_request:
    paths:
      - 'packages/smart/**'
      - '.github/workflows/overfit_smart.yml'

env:
  STORAGE: ${{ github.event.inputs.storage || 'packages/smart/data/raw' }}
  PREPROCESS_INPUT: ${{ github.event.inputs.preprocess_input || 'data/raw/train' }}
  PREPROCESS_OUTPUT: ${{ github.event.inputs.preprocess_output || 'data/processed/train' }}
  MIN_ACCURACY: "0.3"

jobs:
  extract-and-preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run partial_extract action
        uses: ./.github/actions/partial_extract
        with:
          scenarios: '1'
          storage: ${{ env.STORAGE }}

      - name: Install uv and system dependencies
        run: |
          python -m pip install -q uv
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Run preprocess script
        working-directory: packages/smart
        run: bash scripts/run_preprocess.sh "${{ env.PREPROCESS_INPUT }}" "${{ env.PREPROCESS_OUTPUT }}"

      - name: Sanity check on CPU SMART
        working-directory: packages/smart
        run: |
          uv sync
          uv run train.py --cpu --return_metrics metrics.json \
            --config configs/train/sanity_check.yaml

      - name: Check training metrics
        working-directory: packages/smart
        run: |
          cat metrics.json
          accuracy=$(jq '.accuracy'      metrics.json)
          loss_dec=$(jq '.loss_decrease' metrics.json)
          awk -v a="$accuracy" -v m=${{ env.MIN_ACCURACY }} \
            'BEGIN { if (a < m) { print "FAIL: accuracy " a " < " m; exit 1 } }'
          awk -v d="$loss_dec" \
            'BEGIN { if (d < 0) { print "FAIL: loss increased by " -d; exit 1 } }'