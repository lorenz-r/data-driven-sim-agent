name: Partial Extract Action
description: "Run partial TAR extraction and list results"
inputs:
  scenarios:
    description: "Number of scenarios to keep"
    required: false
    default: '1'
  storage:
    description: "Relative path inside the repo to store extracted data"
    required: false
    default: 'packages/smart/data/raw'

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Run extractor
      shell: bash
      run: |
        SCENARIOS_INPUT="${{ inputs.scenarios }}"
        STORAGE_INPUT="${{ inputs.storage }}"
        if [ -z "$SCENARIOS_INPUT" ]; then
          SCENARIOS_INPUT=1
        fi
        if [ -z "$STORAGE_INPUT" ]; then
          STORAGE_INPUT=packages/smart/data/raw
        fi
        OUT_PATH="$GITHUB_WORKSPACE/$STORAGE_INPUT"
        mkdir -p "$OUT_PATH"
        echo "Running extractor: scenarios=$SCENARIOS_INPUT out=$OUT_PATH"
        python dataset/partial_tar_extract.py --scenarios "$SCENARIOS_INPUT" --out "$OUT_PATH"

    - name: List extracted files
      shell: bash
      run: |
        STORAGE_INPUT="${{ inputs.storage }}"
        if [ -z "$STORAGE_INPUT" ]; then
          STORAGE_INPUT=packages/smart/data/raw
        fi
        OUT_PATH="$GITHUB_WORKSPACE/$STORAGE_INPUT"
        echo "Listing files under $OUT_PATH"
        if [ -d "$OUT_PATH" ]; then
          find "$OUT_PATH" -type f -print || true
        else
          echo "No output directory found at $OUT_PATH"
        fi
