name: SMART training pipeline
description: Download scenarios, install system dependencies, and run the SMART sanity check.#-#

inputs:
  config:
    description: "Training config path relative to packages/smart"
    required: true
  cpu:
    description: "Whether to force training on CPU"
    required: false
    default: "false"
  scenarios:
    description: "Number of scenarios to extract"
    required: false
    default: "1"
  storage:
    description: "Relative path inside the repo to store extracted data"
    required: false
    default: "packages/smart/data/raw"
  preprocess_input:
    description: "Preprocess input path relative to packages/smart"
    required: false
    default: "data/raw/train"
  preprocess_output:
    description: "Preprocess output path relative to packages/smart"
    required: false
    default: "data/processed/train"
  metrics_path:
    description: "Metrics output path relative to packages/smart"
    required: false
    default: "metrics.json"
  min_accuracy:#-#
    description: "Minimum required accuracy (empty = skip accuracy check)"#-#
    required: false
    default: ""#-#

runs:
  using: composite
  steps:
    - name: Set up uv#-#
      uses: astral-sh/setup-uv@v5#-#
      with:
        enable-cache: true#-#
        cache-suffix: "py3.11"#-#

    - name: Download scenarios
      shell: bash
      run: |
        scenarios="${{ inputs.scenarios }}"
        storage="${{ inputs.storage }}"

        if [ -z "$scenarios" ]; then
          scenarios=1
        fi

        if [ -z "$storage" ]; then
          storage=packages/smart/data/raw
        fi

        out_path="$GITHUB_WORKSPACE/$storage"
        mkdir -p "$out_path"

        echo "Running extractor: scenarios=$scenarios out=$out_path"
        uv run python dataset/partial_tar_extract.py --scenarios "$scenarios" --out "$out_path"#-#
        find "$out_path" -type f -print || true

    - name: Install system dependencies#-#
      shell: bash
      run: sudo apt-get install -y libgl1 libglib2.0-0#-#

    - name: Run sanity check#-#
      shell: bash
      env:#-#
        CONFIG: ${{ inputs.config }}#-#
        CPU: ${{ inputs.cpu }}#-#
        PREPROCESS_INPUT: ${{ inputs.preprocess_input }}#-#
        PREPROCESS_OUTPUT: ${{ inputs.preprocess_output }}#-#
        METRICS_PATH: ${{ inputs.metrics_path }}#-#
        MIN_ACCURACY: ${{ inputs.min_accuracy }}#-#
      run: bash sanity_check.sh#-#
