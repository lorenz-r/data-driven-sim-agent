name: SMART training pipeline
description: Download scenarios, preprocess them, install SMART dependencies, and run training.

inputs:
  config:
    description: "Training config path relative to packages/smart"
    required: true
  cpu:
    description: "Whether to force training on CPU"
    required: false
    default: "false"
  scenarios:
    description: "Number of scenarios to extract"
    required: false
    default: "1"
  storage:
    description: "Relative path inside the repo to store extracted data"
    required: false
    default: "packages/smart/data/raw"
  preprocess_input:
    description: "Preprocess input path relative to packages/smart"
    required: false
    default: "data/raw/train"
  preprocess_output:
    description: "Preprocess output path relative to packages/smart"
    required: false
    default: "data/processed/train"
  metrics_path:
    description: "Metrics output path relative to packages/smart"
    required: false
    default: "metrics.json"
  python_version:
    description: "Python version used by setup-python"
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python_version }}

    - name: Download scenarios
      shell: bash
      run: |
        scenarios="${{ inputs.scenarios }}"
        storage="${{ inputs.storage }}"

        if [ -z "$scenarios" ]; then
          scenarios=1
        fi

        if [ -z "$storage" ]; then
          storage=packages/smart/data/raw
        fi

        out_path="$GITHUB_WORKSPACE/$storage"
        mkdir -p "$out_path"

        echo "Running extractor: scenarios=$scenarios out=$out_path"
        python dataset/partial_tar_extract.py --scenarios "$scenarios" --out "$out_path"
        find "$out_path" -type f -print || true

    - name: Install uv and system dependencies
      shell: bash
      run: |
        python -m pip install -q uv
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Preprocess scenarios
      shell: bash
      working-directory: packages/smart
      run: bash scripts/run_preprocess.sh "${{ inputs.preprocess_input }}" "${{ inputs.preprocess_output }}"

    - name: Install SMART dependencies
      shell: bash
      working-directory: packages/smart
      run: uv sync

    - name: Run SMART training on CPU
      if: ${{ inputs.cpu == 'true' }}
      shell: bash
      working-directory: packages/smart
      run: |
        uv run train.py --cpu --return_metrics "${{ inputs.metrics_path }}" \
          --config "${{ inputs.config }}"

    - name: Run SMART training
      if: ${{ inputs.cpu != 'true' }}
      shell: bash
      working-directory: packages/smart
      run: |
        uv run train.py --return_metrics "${{ inputs.metrics_path }}" \
          --config "${{ inputs.config }}"
