[project]
name = "smart"
version = "0.2.0"
description = "SMART: Scalable Multi-agent Realistic Motion Transformer"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.5.0,<2.6",
    "pytorch-lightning==2.4.0",
    "torchmetrics>=1.6.0,<2",
    "torch-geometric==2.6.1",
    "torch-cluster>=1.6.3,<1.7",
    "torch-scatter>=2.1.2,<2.2",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "easydict>=1.13,<2",
    "PyYAML>=6.0,<7",
    "tqdm>=4.66,<5",
    "wandb>=0.26,<1",
    "python-dotenv>=1.0,<2",
    "av2",
    "opencv-python"
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[tool.uv]
index-strategy = "unsafe-best-match"
find-links = ["https://data.pyg.org/whl/torch-2.5.0+cu124.html"]
dependency-metadata = [
    { name = "torch-cluster", requires-dist = ["scipy"] },
    { name = "torch-scatter", requires-dist = [] },
]
no-build-isolation-package = ["torch-cluster", "torch-scatter"]
