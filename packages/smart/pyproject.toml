[project]
name = "smart"
version = "0.2.0"
description = "SMART: Scalable Multi-agent Realistic Motion Transformer"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.5.0,<2.6",
    "torchvision>=0.20.0,<0.21",
    "pytorch-lightning==2.4.0",
    "torchmetrics>=1.6.0,<2",
    "torch-geometric==2.6.1",
    "torch-cluster>=1.6.3,<1.7",
    "torch-scatter>=2.1.2,<2.2",
    "torch-sparse>=0.6.18,<0.7",
    "torch-spline-conv>=1.2.2,<1.3",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "scikit-learn>=1.6,<2",
    "pillow>=10.0",
    "easydict>=1.13,<2",
    "PyYAML>=6.0,<7",
    "tqdm>=4.66,<5",
    "dacite>=1.8,<2",
    "typeguard>=2.13,<5",
    "tenacity>=9.1,<10",
    "psutil>=6.1,<7",
    "wandb>=0.26,<1",
    "python-dotenv>=1.0,<2",
    "imageio>=2.37,<3",
    "plotly>=5.13,<6",
    "pyarrow>=14,<20",
    "packaging>=24.0",
    "fsspec>=2024.0",
    "h5py>=3.14,<4",
    "requests>=2.31,<3",
    "protobuf>=3.20,<5",
    "trimesh>=4.12,<5",
    "scikit-image>=0.20,<1",
    "importlib-metadata>=8.7",
    "ipdb>=0.13",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[tool.uv]
index-strategy = "unsafe-best-match"
find-links = ["https://data.pyg.org/whl/torch-2.5.0+cu124.html"]
