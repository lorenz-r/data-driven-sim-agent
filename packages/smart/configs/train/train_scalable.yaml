# Config format schema number, the yaml support to valid case source from different dataset
time_info: &time_info
  num_historical_steps: 50
  num_future_steps: 60
  use_intention: True
  token_size: 2048

token_info: &token_info
  agent_token_path: "smart/tokens/cluster_frame_5_2048.pkl"
  map_token_path: "smart/tokens/map_traj_token5.pkl"

Dataset:
  root:
  train_batch_size: 10
  val_batch_size: 10
  test_batch_size: 1
  shuffle: True
  num_workers: 1
  pin_memory: True
  persistent_workers: True
  token_processor_backend: rust
  train_raw_dir: ["data/av2_processed/training"]
  val_raw_dir: ["data/av2_processed/validation"]
  test_raw_dir:
  transform: WaymoTargetBuilder
  train_processed_dir:
  val_processed_dir:
  test_processed_dir:
  dataset: "scalable"
  <<: [*time_info, *token_info]
  build_agent_tokens_if_missing: False
  agent_token_build_max_samples: 1000000
  agent_token_build_kdisks_max_attempts: 1000000
  agent_token_build_seed: 42

Trainer:
  strategy: ddp_find_unused_parameters_false
  accelerator: "gpu"
  devices: 1
  max_epochs: 40
  save_ckpt_path:
  num_nodes: 1
  mode:
  ckpt_path:
  precision: 32
  accumulate_grad_batches: 1

Model:
  mode: "train"
  predictor: "smart"
  dataset: "waymo"
  input_dim: 2
  hidden_dim: 128
  output_dim: 2
  output_head: False
  num_heads: 8
  <<: [*time_info, *token_info]
  head_dim: 16
  dropout: 0.1
  num_freq_bands: 64
  lr: 0.0011
  warmup_steps: 0
  total_steps: 32
  loss:
    type: "spatial_aware_label_smoothing"
    label_smoothing: 0.1
    distance_epsilon: 0.001
    trajectory_dims: [0, 1]
    chunk_size: 4096
    mtp_enabled: false
    mtp_use_transformer_head: false
    mtp_offsets: [1, 2, 3]
    mtp_loss_weights: [1.0, 0.1, 0.03]
  decoder:
    <<: *time_info
    num_map_layers: 3
    num_agent_layers: 6
    a2a_radius: 60
    pl2pl_radius: 10
    pl2a_radius: 30
    time_span: 30
