# Use default paths from the top level config (don't modify this)
defaults:
  - /paths
train_path: ${processed_train}
val_path: ${processed_val}
test_path: ${processed_test}

# Loader settings
train_batch_size: 1
val_batch_size: 1
data_workers: 8
shuffle_train: true
pin_memory: true
persistent_workers: false
mode: proc # load processed