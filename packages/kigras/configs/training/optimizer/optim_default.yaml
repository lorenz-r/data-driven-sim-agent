# Optimizer settings
optimizer: "adamw"
learning_rate: 0.009722355957868013
weight_decay: 4.9567270230964e-06
beta1: 0.9
beta2: 0.999
epsilon: 1e-8
momentum: 0.9
scheduler: "cosine"
scheduler_params:
  step_size: 10
  gamma: 0.1
  eta_min: 1e-6
  warmup_epochs: 0

# LR scheduler actually used by KiGRAS_HA.configure_optimizers.
# name: onecycle | cosine | none.  Defaults reproduce the previous hardcoded
# OneCycleLR (max_lr=learning_rate, 30% warmup, cosine anneal, per-step).
lr_scheduler:
  name: onecycle
  interval: step
  params:
    pct_start: 0.3
    anneal_strategy: cos
