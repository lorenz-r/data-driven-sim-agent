[project]
name = "argoverse-forecasting"
version = "0.1.0"
description = "Argoverse motion forecasting baselines"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.2",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
